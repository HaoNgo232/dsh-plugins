# auto-compact: condense the conversation at an ABSOLUTE token threshold
# (default 200000) instead of the shipped engine's window-ratio trigger.
#
# The shipped @deepseek-ai/dsh-compaction-basic row stays mounted and keeps
# working; it only fires at its own (usually much later) ratio threshold. This
# row adds the early trigger and reuses the same engine through
# ctx.compaction.compactRegion(), so summaries, retention, locking and the
# /compact command behave exactly as they do today.
- insert:
    - id: auto-compact
      name: '@local/auto-compact'
      config:
        thresholdTokens: 200000
        retainTokens: 30000
        maxAttempts: 2
        enabled: true
        debug: false
